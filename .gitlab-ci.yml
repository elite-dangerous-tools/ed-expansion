image: node:lts

pages:
    stage: deploy
    cache:
        paths:
            - node_modules/
            - yarn.lock
    script:
        - npm install
        - npm run build
        - rm -Rf public
        - mv build public
    artifacts:
        paths:
            - public
    only:
        - master
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
